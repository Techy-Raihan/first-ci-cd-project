name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Java 21 / PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: order_management_test
          POSTGRES_USER: order_app
          # Disposable CI-only password, not a development/production credential.
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U order_app -d order_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ORDER_TEST_DB_URL: jdbc:postgresql://localhost:5432/order_management_test
      ORDER_TEST_DB_USERNAME: order_app
      ORDER_TEST_DB_PASSWORD: ci_test_password
      COMPOSE_DB_PASSWORD: ci_container_password

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run ordinary and PostgreSQL integration tests and package JAR
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify -Ppostgres-it

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: order-management-${{ github.sha }}
          path: target/order-management-system-*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Build Docker image
        run: docker compose -p ci build --pull app

      - name: Check container startup and application health
        run: |
          docker compose -p ci up --no-build -d --wait --wait-timeout 180
          curl --fail --silent --show-error http://localhost:8080/actuator/health

      - name: Export image for scanning
        run: |
          mkdir -p scan
          docker save order-management:local -o scan/image.tar

      - name: Scan image and save full vulnerability report
        run: |
          docker run --rm \
            -v "$PWD/scan:/scan" \
            aquasec/trivy:0.75.0 image \
            --input /scan/image.tar --scanners vuln \
            --format json --output /scan/trivy-report.json --exit-code 0

      - name: Fail on fixable high or critical vulnerabilities
        run: |
          docker run --rm \
            -v "$PWD/scan:/scan" \
            -v "$PWD/.trivyignore.yaml:/policy/.trivyignore.yaml:ro" \
            aquasec/trivy:0.75.0 image \
            --input /scan/image.tar --scanners vuln \
            --ignorefile /policy/.trivyignore.yaml \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

      - name: Save scanned image for publishing
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: scanned-image-${{ github.sha }}
          path: scan/image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload vulnerability report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.run_id }}
          path: scan/trivy-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Show container logs
        if: ${{ always() }}
        run: docker compose -p ci logs --no-color --tail=100

      - name: Stop CI containers
        if: ${{ always() }}
        run: docker compose -p ci down

  publish-image:
    name: Publish scanned image to GHCR
    needs: build-and-test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Download tested and scanned image
        uses: actions/download-artifact@v4
        with:
          name: scanned-image-${{ github.sha }}
          path: scan

      - name: Load image
        run: docker load --input scan/image.tar

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Publish image with commit and latest tags
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          docker tag order-management:local "$IMAGE:sha-$COMMIT_SHA"
          docker tag order-management:local "$IMAGE:latest"
          docker push "$IMAGE:sha-$COMMIT_SHA"
          docker push "$IMAGE:latest"
          printf '### Published container image\n\n`%s:sha-%s`\n\n`%s:latest`\n' "$IMAGE" "$COMMIT_SHA" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io
